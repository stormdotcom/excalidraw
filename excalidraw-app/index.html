    <!--   to minimize white flash on load when user has dark mode enabled   -->
    <script>
      try {
        function setTheme(theme) {
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        }

        function getTheme() {
          const theme = window.localStorage.getItem("excalidraw-theme");

          if (theme && theme === "system") {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            return theme || "light";
          }
        }

        setTheme(getTheme());
      } catch (e) {
        console.error("Error setting dark mode", e);
      }
    </script>
    <style>
      html.dark {
        background-color: #121212;
        color: #fff;
      }
    </style>

    <!-- FIXME: remove this when we update CRA (fix SW caching) -->
    <style>
      body,
      html {
        margin: 0;
        -webkit-text-size-adjust: 100%;

        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* pre-JS loader — mirrors .draw-loader in packages/excalidraw/css/app.scss */
      #root > .LoadingMessage {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #1e1e1e;
      }
      html.dark #root > .LoadingMessage {
        background: #121212;
        color: #ced4da;
      }
      .draw-loader {
        --draw-loader-color: #6965db;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        font-family: "Assistant", system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }
      html.dark .draw-loader {
        --draw-loader-color: #a8a5ff;
      }
      .draw-loader__art {
        width: 88px;
        height: 88px;
        overflow: visible;
      }
      .draw-loader__shape path {
        fill: none;
        stroke: var(--draw-loader-color);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw-loader-stroke 2.4s cubic-bezier(0.6, 0, 0.3, 1) infinite;
      }
      .draw-loader__shape path + path {
        stroke-width: 1.5;
        opacity: 0.55;
      }
      .draw-loader__shape.s1 path {
        animation-delay: 0.25s;
      }
      .draw-loader__shape.s2 path {
        animation-delay: 0.5s;
      }
      .draw-loader__title {
        margin-top: 0.4rem;
        font-family: "Excalifont", "Virgil", "Segoe Print", "Comic Sans MS",
          cursive;
        font-size: 1.6rem;
        line-height: 1;
        color: var(--draw-loader-color);
      }
      .draw-loader__label {
        font-size: 0.8rem;
        opacity: 0.65;
        letter-spacing: 0.02em;
      }
      @keyframes draw-loader-stroke {
        0% {
          stroke-dashoffset: 1;
          opacity: 1;
        }
        45%,
        78% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .draw-loader__shape path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }

      .visually-hidden {
        position: absolute !important;
        height: 1px;
        width: 1px;
        overflow: hidden;
        clip: rect(1px, 1px, 1px, 1px);
        white-space: nowrap;
        user-select: none;
      }

      #root {
        height: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      @media screen and (min-width: 1200px) {
        #root {
          -webkit-touch-callout: default;
          -webkit-user-select: auto;
          -khtml-user-select: auto;
          -moz-user-select: auto;
          -ms-user-select: auto;
          user-select: auto;
        }
      }
    </style>
